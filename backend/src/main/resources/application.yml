spring:
  application:
    name: roommate-match
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/roommate_match}
    username: ${DB_USER:roommate}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB

app:
  routing:
    base-url: https://routing.openstreetmap.de
    timeout: 10s
  rag:
    documents-dir: ${RAG_DOCUMENTS_DIR:dorm-documents}
    ingest-on-startup: true
    results: 5
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash-lite
    embedding-model: gemini-embedding-2
    base-url: https://generativelanguage.googleapis.com/v1beta
    api-revision: 2026-05-20
    timeout: 30s
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173}
  matching:
    apartment:
      habits: 0.35
      rent: 0.25
      location: 0.25
      hobbies: 0.15
    dorm:
      habits: 0.70
      hobbies: 0.30
    # Multiplies the score of two students who want different room types in a dorm where that matters.
    different-room-type-factor: 0.5
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 7d
