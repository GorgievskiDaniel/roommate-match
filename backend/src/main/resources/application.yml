spring:
  application:
    name: roommate-match
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/roommate_match}
    username: ${DB_USER:roommate}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB

app:
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 7d
