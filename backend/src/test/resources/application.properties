# Tests must never reach the real model, whatever is in a local .env file.
app.gemini.api-key=
app.rag.ingest-on-startup=false
# Tests log in many times from the same address; RateLimitIntegrationTest sets its own low limits.
app.rate-limit.auth=10000
app.rate-limit.ai=10000
app.rate-limit.addresses=10000
