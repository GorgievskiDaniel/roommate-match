services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: roommate_match
      POSTGRES_USER: roommate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-roommate-dev}
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roommate -d roommate_match"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every e-mail the backend sends during local work. http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
